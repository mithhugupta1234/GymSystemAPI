version: '3.8'
services:
  mssqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Admin@123
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD", "/opt/mssql-tools/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "Admin@123", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  gymapi:
    build: .
    depends_on:
      mssqlserver:
        condition: service_healthy
    environment:
      - ConnectionStrings__DefaultConnection=Server=mssqlserver,1433;Database=GymDB;User Id=sa;Password=Admin@123;TrustServerCertificate=True;
      - ASPNETCORE_URLS=http://+:5000
    ports:
      - "5002:5000"
    restart: on-failure
